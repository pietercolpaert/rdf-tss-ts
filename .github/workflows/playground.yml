name: Playground

# Builds the playground with example sources in every format, checks it in a real
# browser, and publishes it with GitHub Pages (Settings > Pages > Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check and test
        run: |
          npm run typecheck
          npm test

      - name: Build the examples and the playground
        run: npm run build:site

      - name: Check the playground in Chrome
        run: npm run test:playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
